<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PixLift</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main id="app">
<header>
<h1>PixLift</h1>
<p class="tagline">AI 图片像素提升 · 局域网工具</p>
</header>

<!-- 预设按钮 -->
<section id="presets" aria-label="快速预设">
<button class="preset" data-preset="photo">📷 通用照片</button>
<button class="preset" data-preset="anime">🎨 动漫插画</button>
<button class="preset" data-preset="web">🌐 网页素材</button>
</section>

<!-- 拖拽区 -->
<section id="drop-zone" aria-label="拖入或点击上传图片">
<div class="drop-inner">
<p class="drop-prompt">把图片拖到这里，或点击选择（支持多张）</p>
<p class="drop-hint">支持 PNG / JPG / WebP / GIF · 单图最大 20 MB · 长边 ≤ 4096 px</p>
<input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
</div>
</section>

<!-- 文件队列（多文件时显示） -->
<section id="queue" hidden>
<h3>待处理 <span id="queue-count" class="badge">0</span></h3>
<ul id="queue-list"></ul>
</section>

<!-- 配置面板 -->
<section id="config" hidden>
<div class="row">
<label for="model">模型</label>
<select id="model">
<option value="realesrgan-x4plus">realesrgan-x4plus（通用）</option>
<option value="realesrgan-x4plus-anime">realesrgan-x4plus-anime（动漫）</option>
<option value="realesr-animevideov3">realesr-animevideov3（动漫·快）</option>
<option value="realesrnet-x4plus">realesrnet-x4plus（更自然）</option>
</select>
</div>

<!-- 缩放模式：倍率 vs 长边 -->
<div class="row">
<label>缩放</label>
<div class="mode-toggle">
<button class="mode-btn active" data-mode="scale">按倍率</button>
<button class="mode-btn" data-mode="long_edge">按长边</button>
</div>
</div>
<div class="row" id="row-scale">
<label for="scale">倍率</label>
<select id="scale">
<option value="2">2×</option>
<option value="3">3×</option>
<option value="4" selected>4×</option>
</select>
</div>
<div class="row" id="row-long-edge" hidden>
<label for="long-edge">目标长边</label>
<select id="long-edge">
<option value="1024">1024 px</option>
<option value="1536">1536 px</option>
<option value="2048" selected>2048 px</option>
<option value="3072">3072 px</option>
<option value="4096">4096 px</option>
</select>
</div>

<div class="row">
<label for="format">输出</label>
<select id="format">
<option value="png">PNG（无损）</option>
<option value="jpg">JPG（更小）</option>
<option value="webp">WebP（更小）</option>
</select>
</div>
<div class="row" id="row-quality" hidden>
<label for="quality">质量 <span id="quality-val" class="muted">90</span></label>
<input type="range" id="quality" min="50" max="100" value="90" step="5">
</div>

<div class="file-info">
<span id="file-summary"></span>
</div>

<button id="submit" class="primary" disabled>开始处理</button>
<button id="cancel" class="ghost" hidden>取消</button>
</section>

<!-- 进度区 -->
<section id="progress" hidden>
<div class="bar"><div id="bar-fill"></div></div>
<p id="progress-text">准备中…</p>
<p id="progress-detail" class="muted"></p>
</section>

<!-- 错误 -->
<section id="error" hidden role="alert"></section>

<!-- 结果区（单张） -->
<section id="result" hidden>
<h2>处理完成</h2>

<!-- 对比工具栏 -->
<div class="compare-toolbar" role="toolbar" aria-label="对比工具栏">
<button class="ghost btn-quick" data-quick="before" title="只看原图（按住 Alt 切到结果图）">只看原图</button>
<button class="ghost btn-quick active" data-quick="split" title="拖动 / 方向键 / 鼠标悬停">左右对比</button>
<button class="ghost btn-quick" data-quick="after" title="只看结果">只看结果</button>
<span class="sep"></span>
<button class="ghost btn-zoom" data-zoom="out" title="缩小 (-)">−</button>
<span class="zoom-label" id="zoom-label">100%</span>
<button class="ghost btn-zoom" data-zoom="in" title="放大 (+)">+</button>
<button class="ghost btn-zoom" data-zoom="fit" title="适应窗口 (0)">适应</button>
<button class="ghost btn-zoom" data-zoom="100" title="实际尺寸 (1)">1:1</button>
<span class="sep"></span>
<button class="ghost btn-flip" data-flip="0" title="左原图 / 右结果">⇆ 默认</button>
<button class="ghost btn-flip" data-flip="1" title="左结果 / 右原图">⇆ 翻转</button>
<span class="hint">提示：拖动 / 方向键 ←→ / 双击切换 / Alt+悬停</span>
</div>

<div class="compare-viewport" id="compare-viewport">
<div class="compare" id="compare">
<div class="layer layer-before"><img id="img-before" alt="before"></div>
<div class="layer layer-after"><img id="img-after" alt="after"></div>
<div class="divider" id="divider" tabindex="0" role="slider" aria-label="对比分隔线" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50">
<span class="handle">⇆</span>
</div>
<div class="loupe" id="loupe" hidden aria-hidden="true"></div>
</div>
</div>

<p class="result-meta" id="result-meta"></p>
<div class="result-actions">
<a id="download" class="primary" download>下载结果</a>
<button id="reset" class="ghost">处理下一张</button>
</div>
</section>
</main>
<footer>
<p>PixLift · 仅供内网使用</p>
</footer>
<script src="/static/app.js?v=3"></script>
</body>
</html>
