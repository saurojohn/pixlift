[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixlift"
version = "0.1.0"
description = "Lan-only AI image super-resolution web app (Real-ESRGAN + FastAPI + PyTorch)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PixLift" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    # pillow 10.4+ 修复 CVE-2023-50447 / CVE-2024-2828 / CVE-2024-4158 / CVE-2024-52596 / CVE-2025-48378
    "pillow>=10.4.0,<13.0",
    "pydantic>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
pixlift = "pixlift.__main__:main"

[tool.setuptools.packages.find]
include = ["pixlift*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Ruff 配置：
# - B008: FastAPI 的 `image: UploadFile = File(...)` 是官方文档用法，禁止调用在默认参数会误报
# - I001: engine.py 内的 lazy import 顺序按依赖排列（basicsr 在 realesrgan 前）
# - bin_setup.py 是 ncnn 时代遗留（PyTorch 后端已替换），不再维护；不在 ruff 检查范围内
[tool.ruff]
extend-exclude = ["pixlift/bin_setup.py"]

[tool.ruff.lint]
# PyTorch / 第三方代码本来就 raise 很宽，不强制 BLE001；PLR1730 风格调整不值得为它大改
ignore = [
    "BLE001",  # blind except: 太多地方需要
    "PLR1730", # if → max()：不影响行为
    "RUF100",  # unused noqa（CI 偶尔 stale）
    "UP037",   # quoted type annotation: Engine 在前向引用里仍需要引号
]

# B008 误报：FastAPI 的 `File()` / `Form()` 是官方文档用法，调用在参数默认里是规范
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
]